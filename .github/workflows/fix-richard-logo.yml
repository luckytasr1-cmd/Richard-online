name: Fix Richard logo

on:
  push:
    paths:
      - '.github/workflows/fix-richard-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace temporary SVG with Richard logo
        shell: bash
        run: |
          python - <<'PY'
          import base64, re
          from pathlib import Path

          logo_b64 = ''''''
          Path('assets').mkdir(exist_ok=True)
          Path('assets/richard-logo.jpg').write_bytes(base64.b64decode(logo_b64))

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacement = '<img class="logoSvg" src="assets/richard-logo.jpg" alt="Richard Ferretería">'
          s, n = re.subn(r'<svg class="logoSvg".*?</svg>', replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('No se encontró el SVG temporal del logo')
          s = s.replace('.logoSvg{width:78px;height:78px;display:block}', '.logoSvg{width:78px;height:78px;display:block;border-radius:50%;object-fit:cover;object-position:center;border:2px solid #111;background:#d17b4a}')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit logo fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/richard-logo.jpg
          git commit -m "Use real Richard logo in header"
          git push
